[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-domain-client"
version = "0.1.0"
description = "虚拟域独立桌面客户端"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6>=6.7"]
packaging = ["PySide6==6.8.3", "pyinstaller==6.22.3"]

[project.scripts]
virtual-domain-client = "virtual_domain_client.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
